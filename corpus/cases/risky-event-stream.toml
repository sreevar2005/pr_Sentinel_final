kind = "risky"
title = "New dependency whose code decrypts a hex payload and runs it"
source = "recreation of the event-stream / flatmap-stream incident (npm, 2018)"
expect = [
    "DEP001 package.json:3",
    "OBF004 lib/flatmap.js:4",
    "OBF005 lib/flatmap.js:5",
]
allow = ["DEP001 package.json:2"]

[[file]]
path = "package.json"
removed = ['    "duplexer": "~0.1.1",']
added = [
    '    "duplexer": "~0.1.1",',
    '    "from": "~0",',
    '    "flatmap-stream": "0.1.1",',
]

[[file]]
path = "lib/flatmap.js"
status = "added"
added = [
    "'use strict';",
    "var Stream = require('stream').Stream;",
    "module.exports = function (mapper) { return new Stream(); };",
    "var n = '';",
    "!function () { try { new Function(Buffer.from(n, 'hex').toString())(); } catch (e) {} }();",
]
